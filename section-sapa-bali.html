=====================================================================

  Website: Sekolahku yang BALI - SD Negeri 1 Renon
=====================================================================

CARA PASANG:
1. Buka file index.html Anda.
2. Cari section terakhir sebelum footer (misalnya section "Aturan Sekolah"
   atau langsung sebelum tag <footer>).
3. Copy-paste SELURUH blok <section id="sapa-bali">...</section> di bawah
   ini ke tempat yang diinginkan (disarankan sebelum footer, atau sesudah
   section Dokumentasi).
4. Tambahkan juga link menu "SAPA BALI" di navigasi atas, mengarah ke
   href="#sapa-bali", sejajar dengan menu lain seperti KONTAK.
5. Daftar akun gratis di https://cusdis.com lalu buat "Website" baru.
   Setelah itu Anda akan mendapatkan APP ID (kode acak seperti
   "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx").
6. Ganti tulisan  GANTI_DENGAN_APP_ID_CUSDIS_ANDA  di bawah dengan APP ID
   tersebut (ada 1 tempat, di atribut data-app-id).
7. Simpan, commit ke GitHub, tunggu Vercel selesai deploy. Selesai.

CATATAN MODERASI:
- Komentar baru akan berstatus "menunggu persetujuan" secara default.
- Anda akan mendapat notifikasi email setiap ada komentar baru dari Cusdis,
  dan bisa menyetujui langsung dari email itu (tombol Quick Approve),
  tanpa perlu login ke dashboard.
- Pengunjung TIDAK perlu login/akun apapun untuk mengisi komentar - cukup
  isi nama dan pesan.
=====================================================================
