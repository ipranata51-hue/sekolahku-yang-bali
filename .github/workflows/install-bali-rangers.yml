name: Install website modules

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add website modules to index
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body>'
          if marker not in s:
              raise SystemExit('Cannot find </body> in index.html')
          tags = [
              '<script src="bali-rangers.js"></script>',
              '<script src="activity-hub.js"></script>',
              '<script src="content-manager.js"></script>'
          ]
          changed = False
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
                  changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
              print('Website modules installed.')
          else:
              print('Website modules already installed.')

      - name: Commit installation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Install website content manager"
          git push
