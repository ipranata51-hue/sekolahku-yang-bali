name: Install BALI Rangers module

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add script to index
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="bali-rangers.js"></script>'
          if tag in s:
              print('BALI Rangers module already installed.')
              raise SystemExit(0)
          marker = '</body>'
          if marker not in s:
              raise SystemExit('Cannot find </body> in index.html')
          s = s.replace(marker, tag + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit installation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Install BALI Rangers documentation module"
          git push
