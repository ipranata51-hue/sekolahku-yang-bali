name: Install website modules

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean duplicate UI modules and install one UI module
        shell: python {0}
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Remove all previously injected UI/documentation modules.
          for name in ['activity-hub.js','content-manager.js','popup-fix.js','site-ui.js']:
              s = re.sub(r'<script[^>]+src=["\']'+re.escape(name)+r'["\'][^>]*></script>\s*', '', s, flags=re.I)
          marker='</body>'
          if marker not in s:
              raise SystemExit('Cannot find </body> in index.html')
          # Keep the existing BALI Rangers module, and install one consolidated UI module.
          bali='<script src="bali-rangers.js"></script>'
          if bali not in s:
              s=s.replace(marker,bali+'\n'+marker,1)
          ui='<script src="site-ui.js"></script>'
          s=s.replace(marker,ui+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')

      - name: Commit installation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clean up website UI modules"
          git push
