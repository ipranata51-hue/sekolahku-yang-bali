name: Fix Popup Script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-popup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair nested script tag
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          bad = "document.querySelectorAll('.photoItem img').forEach(i=>i.onerror=()=>{i.style.display='none';i.nextElementSibling.style.display='grid'});\n<script>\nconst aksiData="
          good = "document.querySelectorAll('.photoItem img').forEach(i=>i.onerror=()=>{i.style.display='none';i.nextElementSibling.style.display='grid'});\n\nconst aksiData="
          if bad in s:
              s = s.replace(bad, good, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix popup JavaScript"
          git push
